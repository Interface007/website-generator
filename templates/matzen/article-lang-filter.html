<div id="article-lang-filter" class="lang-filter" role="group" aria-label="Filter articles by language" hidden>
  <span class="lang-filter__label">Language</span>
  <button type="button" class="lang-filter__btn" data-lang="all" aria-pressed="false">All</button>
  <button type="button" class="lang-filter__btn" data-lang="de" aria-pressed="false">Deutsch</button>
  <button type="button" class="lang-filter__btn" data-lang="en" aria-pressed="false">English</button>
  <span id="article-lang-count" class="lang-filter__count" aria-live="polite"></span>
</div>
